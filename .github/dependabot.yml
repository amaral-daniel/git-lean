version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint does not yet support newer TypeScript majors.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/vscode should track engines.vscode (vsce rejects a higher version); bump both by hand.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
