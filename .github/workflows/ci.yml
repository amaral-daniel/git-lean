name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        name: Lint, Format & Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6.1.1
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm run format:check

            - name: Lint
              run: pnpm run lint

            - name: Build
              run: pnpm run compile

            - name: Test
              run: pnpm run test

    webview-preview:
        name: Webview preview
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6.1.1
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps --only-shell chromium

            # Renders every webview with fixture data; fails on console errors,
            # uncaught exceptions or an empty root.
            - name: Check webview previews
              run: pnpm run preview:check

            - name: Upload screenshots
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: webview-screenshots
                  path: out/preview/screenshots/
                  if-no-files-found: ignore
