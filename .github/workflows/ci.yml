name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        name: Lint, Format & Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6.1.1
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm run format:check

            - name: Lint
              run: pnpm run lint

            - name: Type-check webview
              run: pnpm run typecheck:webview

            - name: Build
              run: pnpm run compile

            - name: Test
              run: pnpm run test

            # Same packaging checks vsce/ovsx run at publish time.
            - name: Package extension
              run: pnpm run package

    actionlint:
        name: Lint workflows
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Run actionlint
              run: |
                  bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
                  ./actionlint -color
