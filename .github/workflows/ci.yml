name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        name: Lint, Format & Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6.1.1
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            # Single source of truth: the same command contributors and agents
            # run locally (frozen install, format, lint, webview type-check,
            # build + test, vsce package). See "verify" in package.json.
            - name: Verify
              run: pnpm run verify

    actionlint:
        name: Lint workflows
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # Download script pinned to the v1.7.12 commit (tags can move).
            - name: Run actionlint
              run: |
                  bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
                  ./actionlint -color
